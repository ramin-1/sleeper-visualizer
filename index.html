<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Median Watch — Sleeper</title>
<style>
  :root{
    --bg:#0a0e18; --card:#121a2b; --line:#1f2a40; --txt:#e8edf7; --dim:#8494b0;
    --win:#22c55e; --loss:#ef4444; --tie:#f59e0b; --accent:#38bdf8; --gold:#fbbf24;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:15px/1.45 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1060px;margin:0 auto;padding:24px 16px 64px}
  h1{font-size:20px;margin:0 0 2px;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:13px;margin:0 0 18px}
  form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  input,select,button{background:var(--card);color:var(--txt);border:1px solid var(--line);
    border-radius:8px;padding:9px 12px;font:inherit}
  input{flex:1 1 220px;min-width:0}
  #league{flex:1 1 220px;min-width:0}
  .ghost{background:var(--card);color:var(--dim);border-color:var(--line);font-weight:400}
  .link{all:unset;cursor:pointer;color:var(--accent)}
  .link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #who,#msg{margin:-8px 0 16px}
  #msg.err{color:var(--loss)}
  button{background:var(--accent);color:#04121c;border-color:transparent;font-weight:650;cursor:pointer}
  .bar-head{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:baseline;
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .stat b{font-size:19px;font-variant-numeric:tabular-nums}
  .stat span{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.06em;display:block}
  .note{color:var(--tie);font-size:12.5px;margin:0 0 14px}
  table{width:100%;border-collapse:collapse}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);
    text-align:left;font-weight:600;padding:0 8px 6px;white-space:nowrap}
  td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:middle}
  tr.cut td{border-top:2px dashed var(--accent)}
  .num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .team{display:flex;align-items:center;gap:9px;min-width:150px}
  .team img{width:26px;height:26px;border-radius:6px;background:var(--line);flex:none}
  .team small{display:block;color:var(--dim);font-size:11.5px}
  .uname{font-size:11px;opacity:.8}
  .name{font-weight:600;display:flex;align-items:center;max-width:210px}
  /* Only the team name truncates; the caret, crown and bonus pill keep their space. */
  .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .caret,.crown,.bonus{flex:none}
  .pill{display:inline-block;min-width:20px;text-align:center;padding:2px 7px;border-radius:5px;
    font-size:12px;font-weight:700}
  .W{background:rgba(34,197,94,.16);color:var(--win)}
  .L{background:rgba(239,68,68,.16);color:var(--loss)}
  .T{background:rgba(245,158,11,.16);color:var(--tie)}
  .track{position:relative;height:22px;background:#0d1423;border-radius:5px;min-width:140px;overflow:hidden}
  .fill{height:100%;border-radius:5px}
  .med{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--accent);opacity:.85}
  .gap{font-size:12.5px;font-weight:600}
  .lead{font-weight:700}
  .dim{color:var(--dim)}
  tr.king>td{background:linear-gradient(90deg,rgba(251,191,36,.14),rgba(251,191,36,.04) 55%,transparent)}
  tr.king>td:first-child{box-shadow:inset 3px 0 0 var(--gold);color:var(--gold)}
  tr.king .name{color:#fde68a}
  tr.row.king:hover>td{background:linear-gradient(90deg,rgba(251,191,36,.2),rgba(251,191,36,.07) 55%,transparent)}
  .crown{margin-right:3px}
  .bonus{display:inline-block;margin-left:5px;padding:1px 5px;border-radius:999px;vertical-align:1px;
    background:rgba(251,191,36,.18);color:var(--gold);font-size:10px;font-weight:800;letter-spacing:.03em}
  /* Wraps rather than truncating: nowrap here forces the whole table wider than a phone,
     and Sleeper's own stat lines wrap too. */
  .pl-stats{color:var(--dim);font-size:11px;margin-top:1px}
  .pl-sec{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
    color:var(--dim);padding:12px 6px 5px;border-bottom:1px solid var(--line)}
  /* Bench, IR and taxi do not score this week, so they sit back visually. */
  .side.bn{opacity:.62}
  /* A player whose game is being played right now. */
  .side.ingame{background:rgba(45,212,191,.09);box-shadow:inset 3px 0 0 #2dd4bf}
  .side.r.ingame{box-shadow:inset -3px 0 0 #2dd4bf}
  .pl-prog{position:relative;height:3px;max-width:220px;margin:5px 14px 4px 0;
    background:var(--line);border-radius:2px}
  .pl-prog i{position:absolute;inset:0 auto 0 0;background:#f5a524;border-radius:2px}
  .pl-prog span{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:11px;line-height:1}
  #newver{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:9;
    display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;
    background:#1a2337;border:1px solid var(--gold);color:var(--txt);font-size:13px;
    box-shadow:0 6px 24px rgba(0,0,0,.45)}
  #newver button{padding:5px 10px;font-size:12px}
  /* Live / Proj headers pick what the standings rank on. Real buttons, restyled as header text. */
  th .sort{all:unset;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit}
  th .sort:hover{color:var(--txt)}
  th .sort:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
  th .sort.on{color:var(--accent)}
  th .sort.on::after{content:' \25BE'}
  /* Must out-specify the #newver rule above: the UA's [hidden]{display:none} is only
     (0,0,1,0) and loses to an id selector, so the banner would never hide. */
  #newver[hidden]{display:none}
  /* Chopped leagues: the team on the chopping block, and the teams already cut. */
  tr.block>td{background:linear-gradient(90deg,rgba(239,68,68,.14),rgba(239,68,68,.04) 55%,transparent)}
  tr.block>td:first-child{box-shadow:inset 3px 0 0 var(--loss);color:var(--loss)}
  .team small.chopnote{color:var(--loss)}
  tr.dead td{opacity:.45}
  tr.dead-head td{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
    color:var(--dim);padding-top:16px}
  .mu-head.solo{grid-template-columns:minmax(0,1fr)}
  .mu-row.solo{grid-template-columns:auto minmax(0,1fr)}
  tr.row{cursor:pointer}
  tr.row:hover td{background:#162034}
  .caret{display:inline-block;width:10px;color:var(--dim);font-size:10px;transition:transform .12s}
  tr.row.open .caret{transform:rotate(90deg)}
  tr.detail[hidden]{display:none}
  tr.detail>td{padding:0 8px 12px;background:#0d1423}
  /* Head to head: my player | slot | their player, the opponent's side mirrored. */
  .mu-head,.mu-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px}
  .mu-head{align-items:center;padding:12px 4px 12px;border-bottom:1px solid var(--line)}
  .mu-row{align-items:stretch;border-bottom:1px solid var(--line)}
  .mu-row .pl-slot{align-self:center}
  .mu-team{display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-width:0;padding-bottom:8px}
  .mu-team.r{flex-direction:row-reverse;text-align:right}
  .mu-team.lead{box-shadow:inset 0 -3px 0 var(--win)}
  .mu-team.trail{box-shadow:inset 0 -3px 0 var(--loss)}
  /* Win probability: the bar's length is the team's chance, mirrored on the right like Sleeper's. */
  .mu-wp{flex-basis:100%;display:flex;align-items:center;gap:8px}
  .mu-team.r .mu-wp{flex-direction:row-reverse}
  .mu-bar{flex:1;display:flex;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
  .mu-team.r .mu-bar{justify-content:flex-end}
  .mu-bar i{display:block;height:100%;border-radius:2px;background:var(--dim)}
  .mu-wp.fav .mu-bar i{background:var(--win)}
  .mu-wp.dog .mu-bar i{background:var(--loss)}
  .mu-wp b{font-size:12.5px;font-variant-numeric:tabular-nums}
  .team small.ytp,.mu-who small.ytp{color:#f5a524}
  .mu-team img{width:34px;height:34px;border-radius:50%;flex:none}
  .mu-who{flex:1;min-width:0}
  .mu-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* A username is one unbreakable word (jacksonwiseman1); truncate it like the team name
     or it pushes the whole table wider than a phone. */
  .mu-who small{display:block;color:var(--dim);font-size:11.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mu-pts{flex:none;text-align:right;font-variant-numeric:tabular-nums}
  .mu-team.r .mu-pts{text-align:left}
  .mu-pts b{display:block;font-size:18px}
  .mu-pts span{font-size:12px;color:var(--dim)}
  .mu-vs{width:38px;text-align:center;font-size:11px;font-weight:800;color:var(--dim)}
  .side{display:flex;align-items:center;gap:10px;padding:8px 6px;min-width:0}
  .side.r{flex-direction:row-reverse;text-align:right}
  .side.r .pl-nums{text-align:left}
  .side.r .pl-prog{margin:5px 0 4px auto}
  .pl-img{width:34px;height:34px;border-radius:50%;background:var(--line);object-fit:cover;flex:none}
  .pl-slot{width:38px;flex:none;text-align:center;font-size:10px;font-weight:700;letter-spacing:.04em;
    color:var(--dim);background:#1a2337;border-radius:4px;padding:3px 0}
  .pl-main{flex:1;min-width:0}
  .pl-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl-name span{font-weight:400;color:var(--dim);font-size:11.5px;margin-left:5px}
  .pl-game{color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl-nums{text-align:right;flex:none;font-variant-numeric:tabular-nums;min-width:72px}
  .pl-nums b{display:block;font-size:14px}
  .pl-nums span{font-size:12px;color:var(--dim)}
  .pl-nums span.up{color:var(--win)}
  .pl-nums span.down{color:var(--loss)}
  .err{color:var(--loss)}
  .tw{overflow-x:auto}
  @media(max-width:760px){.hide-s{display:none}.name{max-width:150px}}
  @media(max-width:560px){
    .hide-xs{display:none}
    td,th{padding:6px 3px}
    th{white-space:normal}
    th .sort.on[data-mode]::after{content:' \21C4'}
    .team{min-width:0;gap:6px}
    .team img{width:22px;height:22px}
    .name{max-width:112px}
    .track{min-width:44px}
    /* Two rosters side by side on a phone: drop the headshots, let names and games wrap. */
    .mu-head,.mu-row{gap:4px}
    .side{gap:6px;padding:7px 2px}
    .side .pl-img,.mu-team img{display:none}
    .pl-slot,.mu-vs{width:32px}
    .pl-nums{min-width:40px}
    .pl-nums b{font-size:13px}
    .pl-name{font-size:13px;white-space:normal}
    .pl-name span{display:block;margin:0}
    .pl-game{white-space:normal}
    .mu-pts b{font-size:15px}
  }
</style>

<div class="wrap">
  <h1>Median Watch</h1>
  <p class="sub" id="tagline">Live league-median race — top half banks an extra win, bottom half an extra loss.</p>

  <form id="f">
    <select id="league" aria-label="League" hidden></select>
    <button type="button" id="rm" class="ghost" title="Remove this saved league" aria-label="Remove this saved league" hidden>&#10005;</button>
    <select id="wk" aria-label="Week"></select>
    <input id="add" placeholder="Add your Sleeper username or a league ID" aria-label="Sleeper username or league ID">
    <button>Add</button>
  </form>
  <p id="who" class="sub" hidden></p>
  <p id="msg" class="sub" hidden></p>

  <div id="out"></div>
</div>

<div id="newver" hidden>
  <span>A newer version of this page is available.</span>
  <button type="button" onclick="location.reload()">Reload</button>
</div>

<script>
const HOST = 'https://api.sleeper.app';
const $ = s => document.querySelector(s);
const get = u => fetch(HOST + u).then(r => r.ok ? r.json() : Promise.reject(new Error(u + ' → ' + r.status)));

function median(nums){
  const s = [...nums].sort((a,b) => a-b), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2;
}

// Guillotine ("chopped") leagues: the lowest scorer still alive is eliminated each week and
// there is no head-to-head. Sleeper marks the league with settings.type 3 and
// last_chopped_leg, and each eliminated roster with the week it was cut (settings.eliminated).
const isChopped = (league, rosters) => (league.settings || {}).type === 3
  || (league.settings || {}).last_chopped_leg != null
  || rosters.some(r => (r.settings || {}).eliminated);

// A team chopped in week N was still playing in week N; it is gone from N+1 on.
const choppedBefore = (roster, week) => {
  const e = (roster.settings || {}).eliminated;
  return !!e && e < +week;
};

// Survivors ranked high to low. Each team's gap is its cushion over last place; the team in
// last gets how far it trails the next team up (negative), i.e. what it needs to escape.
// Starters whose NFL game has not kicked off, the way Sleeper lists them: grouped by the
// player's own position (a FLEX receiver counts as WR), in lineup order, with a count when
// there is more than one — "QB, RB, 4 WR, TE, K, DEF". Players mid-game don't count.
const POS_ORDER = ['QB', 'RB', 'WR', 'TE', 'K', 'DEF'];
function yetToPlay(starters, projById, pregame){
  const pos = (starters || []).map(id => projById[id]).filter(p => p && pregame.has(p.team)).map(p => p.pos);
  const count = {};
  pos.forEach(p => count[p] = (count[p] || 0) + 1);
  const rank = p => { const i = POS_ORDER.indexOf(p); return i < 0 ? 99 : i; };
  const list = Object.keys(count).sort((a, b) => rank(a) - rank(b))
    .map(p => count[p] > 1 ? `${count[p]} ${p}` : p).join(', ');
  return { n: pos.length, list };
}

// Standard normal CDF, via the Abramowitz-Stegun erf approximation (error under 2e-7).
function normCdf(z){
  const t = 1 / (1 + 0.3275911 * Math.abs(z) / Math.SQRT2);
  const y = 1 - t * (0.254829592 + t * (-0.284496736 + t * (1.421413741 + t * (-1.453152027 + t * 1.061405429))))
    * Math.exp(-z * z / 2);
  return z >= 0 ? (1 + y) / 2 : (1 - y) / 2;
}

// Sleeper's head-to-head win probability, ported from their web bundle. Each team's final
// score is a normal distribution centred on its live projected total, whose spread shrinks
// as that projection gets banked; the result is P(team 1 finishes ahead), clamped to 1-99%.
// Once both teams have nothing left to play it is simply who won.
function winProb(live1, proj1, live2, proj2){
  const done = (a, p) => a.toFixed(2) === p.toFixed(2);
  if (done(live1, proj1) && done(live2, proj2)) {
    const x = +live1.toFixed(2), y = +live2.toFixed(2);
    return x === y ? [0, 0] : x > y ? [1, 0] : [0, 1];
  }
  const spread = (a, p) => { const v = (a - p) ** 2 / (1 + 10 * (1 - a / p)); return v > 0 ? v : 0.1; };
  const clamp = x => Math.max(0.01, Math.min(0.99, x));
  const w = clamp(normCdf((proj1 - proj2) / Math.sqrt(spread(live1, proj1) + spread(live2, proj2))));
  return [w, clamp(1 - w)];
}

function computeChop(entries){
  const rows = [...entries].sort((a, b) => b.points - a.points);
  const n = rows.length;
  const low = n ? rows[n - 1].points : 0, next = n > 1 ? rows[n - 2].points : low;
  rows.forEach((r, i) => {
    r.block = n > 1 && i === n - 1;            // a lone survivor has won, not been chopped
    r.gap = +(r.block ? r.points - next : r.points - low).toFixed(2);
  });
  return { line: low, rows };
}

// Seconds left in each team's game. This is Sleeper's own clock logic, matched to the
// web app so our projections line up with the numbers shown in their matchup screen.
function secondsLeftByTeam(games){
  const out = {};
  for (const g of games || []) {
    const m = g.metadata || {};
    const q = m.quarter;
    let left;
    if (g.status === 'complete' || m.is_over || q === 'F' || q === 'F/OT' || q === 'OT') left = 0;
    else if (g.status === 'pre_game' || !q) left = 3600;
    else if (q === 'HALF' || q === 'Halftime') left = 1800;
    else {
      const [mm, ss] = String(m.time_remaining || '0:00').split(':').map(n => parseInt(n) || 0);
      left = 15 * (4 - Math.min(+q || 0, 4)) * 60 + 60 * mm + ss;
    }
    if (m.home_team) out[m.home_team] = left;
    if (m.away_team) out[m.away_team] = left;
  }
  return out;
}

// Sleeper's stat line, in their display order. [key, pairedKey, label, showWhenZero]
// A paired key renders "20/22 CMP"; otherwise "287 YD".
const STAT_LINE = [
  ['pass_cmp','pass_att','CMP'], ['pass_yd',null,'YD'], ['pass_td',null,'TD'], ['pass_int',null,'INT'],
  ['rush_att',null,'CAR'], ['rush_yd',null,'YD'], ['rush_td',null,'TD'],
  ['rec','rec_tgt','REC'], ['rec_yd',null,'YD'], ['rec_td',null,'TD'],
  ['fum_lost',null,'FUM LOST'],
  ['fgm','fga','FG'], ['xpm','xpa','XP'],
  ['pts_allow',null,'PTS ALLOW',true], ['yds_allow',null,'YDS ALLOW',true], ['sack',null,'SACK'],
  ['int',null,'INT'], ['ff',null,'FF'], ['fum_rec',null,'FUM REC'], ['def_td',null,'DEF TD'],
  ['def_3_and_out',null,'3 & OUT'], ['def_4_and_stop',null,'4D STOP'], ['def_pass_def',null,'PD']
];
const trim = n => +(+n).toFixed(2);

function statLine(st){
  if (!st) return '';
  return STAT_LINE.map(([key, pair, label, zero]) => {
    const v = st[key];
    if (v == null || (!v && !zero)) return null;
    return pair ? `${trim(v)}/${trim(st[pair] || 0)} ${label}` : `${trim(v)} ${label}`;
  }).filter(Boolean).join(', ');
}

const QUARTER = {'1':'1st','2':'2nd','3':'3rd','4':'4th','HALF':'Half','Halftime':'Half','OT':'OT','F':'Final','F/OT':'Final/OT'};

// "Final W 35-13 vs MIA" / "3:11 4th 24-7 @ ARI" / "Mon, 5:15 PM vs NYG", per team.
function gameLabelByTeam(games){
  const out = {};
  for (const g of games || []) {
    const m = g.metadata || {};
    if (!m.home_team || !m.away_team) continue;
    for (const home of [true, false]) {
      const team = home ? m.home_team : m.away_team;
      const at = (home ? 'vs ' : '@ ') + (home ? m.away_team : m.home_team);
      if (g.status === 'pre_game') {
        const d = new Date(m.date_time || g.start_time);
        out[team] = (isNaN(d) ? '' : d.toLocaleString([], {weekday:'short', hour:'numeric', minute:'2-digit'}) + ' ') + at;
        continue;
      }
      const mine = (home ? m.home_score : m.away_score) || 0;
      const theirs = (home ? m.away_score : m.home_score) || 0;
      const score = `${mine}-${theirs}`;
      out[team] = (g.status === 'complete' || m.is_over || m.quarter === 'F' || m.quarter === 'F/OT')
        ? `Final ${mine > theirs ? 'W' : mine < theirs ? 'L' : 'T'} ${score} ${at}`
        : `${m.time_remaining || ''} ${QUARTER[m.quarter] || m.quarter || ''} ${score} ${at}`.replace(/\s+/g, ' ').trim();
    }
  }
  return out;
}

// Sleeper's live projection, ported from their web bundle. It blends the pre-game
// projection toward the player's current scoring pace as the clock runs down: at kickoff
// you get the projection, at the final whistle you get the actual, and in between a
// weighted mix. Reproduces the number their app displays to the cent.
function liveProjection(actual, projection, secsLeft){
  const mins = 60, left = secsLeft / (60 * mins);
  const pace = actual + actual / ((mins - secsLeft / 60) || 1) * (secsLeft / mins) * left;
  const spread = 0.2 * left * pace + (0.35 + 0.65 * (1 - left)) * pace + 0.45 * left * pace;
  const hi = Math.max(spread, actual);
  const base = left >= 1 ? projection : Math.max(projection, actual);
  if (left <= 0 && actual < 0) return actual;
  return base + (1 - left) * (hi - base);
}

function projectTeam(matchup, projById, secs){
  const pts = matchup.starters_points || [];
  return +(matchup.starters || []).reduce((total, pid, i) => {
    const p = projById[pid];
    if (!p) return total + (pts[i] || 0);
    return total + liveProjection(pts[i] || 0, p.pts, secs[p.team] ?? 0);
  }, 0).toFixed(2);
}

// One row per roster: head-to-head result, median result, and distance from the cut line.
function computeWeek(matchups, score){
  const val = m => score ? score(m) : (m.points || 0);
  const med = median(matchups.map(val));
  const pairs = {};
  for (const m of matchups) if (m.matchup_id != null) (pairs[m.matchup_id] ||= []).push(m);
  const rows = matchups.map(m => {
    const p = val(m);
    const opp = (pairs[m.matchup_id] || []).find(o => o.roster_id !== m.roster_id);
    const op = opp ? val(opp) : null;
    return {
      roster_id: m.roster_id, points: p, live: m.points || 0,
      oppRoster: opp ? opp.roster_id : null, oppPoints: op,
      h2h: op == null ? null : p > op ? 'W' : p < op ? 'L' : 'T',
      med: p > med ? 'W' : p < med ? 'L' : 'T',
      gap: +(p - med).toFixed(2)
    };
  });
  return { median: med, rows };
}

// Hold the reader's place across a re-render. Re-asserted on the next frame because
// layout can still settle after the DOM write (an avatar that 404s removes itself).
function keepScroll(y){
  if (!y) return;
  const restore = () => { if (Math.abs(window.scrollY - y) > 1) window.scrollTo(0, y); };
  restore();
  requestAnimationFrame(restore);
}

const fmt = n => n.toFixed(2);
const esc = s => String(s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

// Projections are a big payload, but Sleeper revises them during the day — most importantly
// when inactives land and a scratched starter's projection drops to zero. Cache, but expire.
const PROJ_TTL = 10 * 60 * 1000;
const projCache = {};
function projections(season, week, scoring){
  const key = season + '-' + week;
  if (projCache[key] && Date.now() - projCache[key].at > PROJ_TTL) delete projCache[key];
  if (!projCache[key]) {
    const pos = ['QB','RB','WR','TE','K','DEF'].map(p => 'position[]=' + p).join('&');
    projCache[key] = { at: Date.now(), rows: get(`/projections/nfl/${season}/${week}?season_type=regular&${pos}&order_by=ppr`)
      .catch(e => { delete projCache[key]; throw e; }) };
  }
  return projCache[key].rows.then(rows => Object.fromEntries(rows.map(r => [r.player_id, {
    team: r.team || r.player.team,
    pos: r.player.position,
    // Sleeper shows team defenses by nickname ("Giants") and everyone else as "B. Purdy".
    name: r.player.position === 'DEF' ? r.player.last_name
        : `${(r.player.first_name || '').charAt(0)}. ${r.player.last_name}`,
    // Score each projection with THIS league's rules rather than Sleeper's generic PPR total.
    pts: Object.entries(scoring).reduce((s, [k, v]) => s + v * (r.stats[k] || 0), 0)
  }])));
}

// Which rosters the user has expanded. Kept outside render so the 30s refresh doesn't collapse them.
const expanded = new Set();

function playerCard(pid, actual, ctx, cls){
  const { projById, secs, labels, stats, playing } = ctx;
  const p = projById[pid];
  const inGame = !!p && playing.has(p.team);
  // How far through the game they are, for the progress line: 3600s is a full game.
  const done = inGame ? Math.min(100, Math.max(0, 100 - (secs[p.team] ?? 3600) / 36)).toFixed(1) : 0;
  const live = p ? liveProjection(actual, p.pts, secs[p.team] ?? 0) : null;
  // Sleeper colours this number against the player's ORIGINAL projection: green if
  // they are now projected above it, red below.
  const trend = !p || Math.abs(live - p.pts) < 0.005 ? '' : live > p.pts ? 'up' : 'down';
  const line = statLine(stats[pid]);
  const img = !p ? '' : p.pos === 'DEF'
    ? `https://sleepercdn.com/images/team_logos/nfl/${esc(String(p.team || '').toLowerCase())}.png`
    : `https://sleepercdn.com/content/nfl/players/thumb/${esc(pid)}.jpg`;
  return `<div class="side ${cls} ${inGame ? 'ingame' : ''}">
    ${img ? `<img class="pl-img" src="${img}" alt="" onerror="this.remove()">` : ''}
    <div class="pl-main">
      <div class="pl-name">${p ? esc(p.name) : 'Empty slot'}${p ? `<span>${esc(p.pos || '')} - ${esc(p.team || 'FA')}</span>` : ''}</div>
      ${inGame ? `<div class="pl-prog"><i style="width:${done}%"></i><span style="left:${done}%">&#127944;</span></div>` : ''}
      <div class="pl-game">${p ? esc(labels[p.team] || 'No game this week') : ''}</div>
      ${line ? `<div class="pl-stats">${esc(line)}</div>` : ''}
    </div>
    <div class="pl-nums">
      <b>${fmt(actual)}</b>
      ${live == null ? '' : `<span class="${trend}">${fmt(live)}</span>`}
    </div>
  </div>`;
}

// One team's players split the way Sleeper lists them: starters (aligned with the league's
// slots), then the sections that do not score — bench, IR, taxi.
function rosterLists(matchup, roster){
  const sp = matchup.starters_points || [], pp = matchup.players_points || {};
  const starters = matchup.starters || [];
  const reserve = roster.reserve || [], taxi = roster.taxi || [];
  const placed = new Set([...starters, ...reserve, ...taxi]);
  const scored = id => ({ id, pts: pp[id] || 0 });
  return {
    starters: starters.map((id, i) => ({ id, pts: sp[i] || 0 })),
    bench: (matchup.players || []).filter(id => !placed.has(id)).map(scored),
    reserve: reserve.map(scored),
    taxi: taxi.map(scored)
  };
}

function teamBox(t, side){
  if (!t.rid) return `<div class="mu-team ${side}"><div class="mu-who dim">Bye week</div></div>`;
  return `<div class="mu-team ${side} ${t.edge || ''}">
    ${t.avatar ? `<img src="https://sleepercdn.com/avatars/thumbs/${esc(t.avatar)}" alt="" onerror="this.remove()">` : ''}
    <div class="mu-who"><div class="mu-name">${esc(t.name)}</div>${t.user ? `<small>${esc(t.user)}</small>` : ''}${t.record ? `<small>${t.record}</small>` : ''}${t.ytp ? `<small class="ytp">Yet to play (${t.ytp.n})${t.ytp.n ? ' &middot; ' + t.ytp.list : ''}</small>` : ''}</div>
    <div class="mu-pts"><b>${fmt(t.live)}</b><span>${fmt(t.proj)} proj</span></div>
    ${t.wp == null ? '' : `<div class="mu-wp ${t.wp > 0.5 ? 'fav' : t.wp < 0.5 ? 'dog' : ''}">
      <div class="mu-bar"><i style="width:${(t.wp * 100).toFixed(1)}%"></i></div><b>${Math.round(t.wp * 100)}%</b>
    </div>`}
  </div>`;
}

// The expanded view: both teams' headers, then the two rosters side by side.
function matchupView(me, opp, ctx, solo){
  const L = rosterLists(me.m, me.roster), R = rosterLists(opp.m || {}, opp.roster || {});
  const card = (it, side, cls) => it ? playerCard(it.id, it.pts, ctx, `${side} ${cls}`) : `<div class="side ${side}"></div>`;
  const rows = (a, b, slot, cls) => Array.from({ length: Math.max(a.length, b.length) }, (_, i) => solo
    ? `<div class="mu-row solo"><div class="pl-slot">${esc(slot(i))}</div>${card(a[i], 'l', cls)}</div>`
    : `<div class="mu-row">${card(a[i], 'l', cls)}<div class="pl-slot">${esc(slot(i))}</div>${card(b[i], 'r', cls)}</div>`).join('');
  const section = (title, a, b, slot) => a.length || b.length
    ? `<div class="pl-sec">${title}</div>` + rows(a, b, () => slot, 'bn') : '';
  return (solo ? `<div class="mu-head solo">${teamBox(me, 'l')}</div>`
               : `<div class="mu-head">${teamBox(me, 'l')}<div class="mu-vs">VS</div>${teamBox(opp, 'r')}</div>`)
    + rows(L.starters, R.starters, i => ctx.slots[i] || '', '')
    + section('Bench', L.bench, R.bench, 'BN')
    + section('Injured Reserve', L.reserve, R.reserve, 'IR')
    + section('Taxi', L.taxi, R.taxi, 'TAXI');
}

async function load(leagueId, week, mode, sort){
  const out = $('#out');
  // Only show the placeholder on a cold load. Blanking a rendered table on every refresh
  // collapses the page height, which scrolls the reader back to the top.
  if (!out.querySelector('table')) out.innerHTML = '<p class="sub">Loading…</p>';
  const [league, users, rosters, matchups] = await Promise.all([
    get(`/v1/league/${leagueId}`), get(`/v1/league/${leagueId}/users`),
    get(`/v1/league/${leagueId}/rosters`), get(`/v1/league/${leagueId}/matchups/${week}`)
  ]);
  if (!league) throw new Error(`No Sleeper league with ID ${leagueId}.`);
  if (!matchups || !matchups.length) {
    out.innerHTML = `<p class="sub">No matchups posted for week ${week} in ${esc(league.name)}.</p>`;
    return league;
  }

  // Projections/scores are best-effort: if either is unavailable, fall back to live points only.
  const [projById, games, stats] = await Promise.all([
    projections(league.season, week, league.scoring_settings || {}).catch(() => ({})),
    get(`/scores/nfl/regular/${league.season}/${week}`).catch(() => []),
    get(`/v1/stats/nfl/regular/${league.season}/${week}`).catch(() => ({}))
  ]);
  const secs = secondsLeftByTeam(games), labels = gameLabelByTeam(games);
  const playing = new Set((games || []).filter(g => g.status === 'in_game')
    .flatMap(g => [g.metadata?.home_team, g.metadata?.away_team]));
  const pregame = new Set((games || []).filter(g => g.status === 'pre_game')
    .flatMap(g => [g.metadata?.home_team, g.metadata?.away_team]));
  const ytp = rid => yetToPlay((matchupById[rid] || {}).starters, projById, pregame);
  // Under a team's name in the table; only shown while someone is still to play.
  const ytpLine = rid => { const y = ytp(rid); return y.n ? `<small class="ytp">${y.n} yet to play &middot; ${y.list}</small>` : ''; };
  const proj = m => projectTeam(m, projById, secs);
  const projOk = Object.keys(projById).length > 0;
  const useProj = mode === 'proj' && projOk;

  const userById = Object.fromEntries(users.map(u => [u.user_id, u]));
  const rosterById = Object.fromEntries(rosters.map(r => [r.roster_id, r]));
  const teamName = rid => {
    const u = userById[(rosterById[rid] || {}).owner_id];
    return u ? ((u.metadata || {}).team_name || u.display_name) : `Roster ${rid}`;
  };

  const chopped = isChopped(league, rosters);
  // In a chopped league only the survivors are ranked; teams already cut are listed apart.
  const dead = chopped ? rosters.filter(r => choppedBefore(r, week))
    .sort((a, b) => b.settings.eliminated - a.settings.eliminated) : [];
  const deadIds = new Set(dead.map(r => r.roster_id));
  $('#tagline').textContent = chopped
    ? 'Live chopping block — the lowest score among the survivors is eliminated this week.'
    : 'Live league-median race — top half banks an extra win, bottom half an extra loss.';
  // `med` is the line the bars are drawn against: the median, or in a chopped league the
  // lowest surviving score — the one everyone else has to stay above.
  let med, rows;
  if (chopped) ({ line: med, rows } = computeChop(matchups.filter(m => !deadIds.has(m.roster_id))
    .map(m => ({ roster_id: m.roster_id, points: useProj ? proj(m) : (m.points || 0), live: m.points || 0 }))));
  else ({ median: med, rows } = computeWeek(matchups, useProj ? proj : null));
  const projByRoster = Object.fromEntries(matchups.map(m => [m.roster_id, proj(m)]));
  rows.sort((a,b) => b.points - a.points);
  rows.forEach((r, i) => r.rank = i + 1);
  // FAAB left, chopped leagues only for now. Sorting by it only reorders the rows: the
  // ranks, the chopping block and the cushions all still come from the scores.
  const faabOn = chopped && (league.settings.waiver_budget || 0) > 0;
  const faabLeft = rid => league.settings.waiver_budget - (((rosterById[rid] || {}).settings || {}).waiver_budget_used || 0);
  const byFaab = faabOn && sort === 'faab';
  const ordered = byFaab ? [...rows].sort((a, b) => faabLeft(b.roster_id) - faabLeft(a.roster_id) || a.rank - b.rank) : rows;
  const max = Math.max(...rows.map(r => r.points), med, 1);
  const pct = v => (v / max * 100).toFixed(2) + '%';
  // Where the dashed line goes: above the bottom half, or above the team on the block.
  const half = byFaab ? -1 : chopped ? (rows.length > 1 ? rows.length - 1 : -1) : rows.length / 2;
  // A phone has no room for both point columns; keep whichever the mode is ranking on.
  const liveCls = useProj ? 'hide-xs' : '', projCls = useProj ? '' : 'hide-xs';
  const slots = (league.roster_positions || []).filter(x => !['BN','IR','TAXI'].includes(x));
  const matchupById = Object.fromEntries(matchups.map(m => [m.roster_id, m]));
  const cols = (projOk ? 9 : 8) - (chopped ? 3 : 0) + (faabOn ? 1 : 0);
  const medianOn = league.settings.league_average_match === 1;
  const inProgress = Object.values(secs).some(v => v > 0 && v < 3600);
  const notStarted = Object.values(secs).filter(v => v === 3600).length;

  const ctx = { projById, secs, labels, stats: stats || {}, playing, slots };
  const rowById = Object.fromEntries(rows.map(x => [x.roster_id, x]));
  // Season record now, then after this week: +1 for each of the H2H and median results.
  const record = r => {
    const s = (rosterById[r.roster_id] || {}).settings || {};
    const w = s.wins || 0, l = s.losses || 0, t = s.ties ? '-' + s.ties : '';
    const add = (r.h2h === 'W' ? 1 : 0) + (r.med === 'W' ? 1 : 0);
    const sub = (r.h2h === 'L' ? 1 : 0) + (r.med === 'L' ? 1 : 0);
    return `${w}-${l}${t} &rarr; ${w + add}-${l + sub}${t}`;
  };
  const teamSide = (id, edge) => {
    if (id == null) return {};
    const u = userById[(rosterById[id] || {}).owner_id] || {};
    const name = teamName(id);
    return {
      rid: id, edge, name, avatar: u.avatar, record: !chopped && rowById[id] ? record(rowById[id]) : '',
      // Same rule as the table: only show the username when it isn't already the name.
      user: u.display_name && u.display_name.trim() !== name.trim() ? u.display_name : '',
      m: matchupById[id] || {}, roster: rosterById[id] || {},
      live: (matchupById[id] || {}).points || 0, proj: projByRoster[id], ytp: ytp(id)
    };
  };

  const chopCells = (r, i) => {
    const u = userById[(rosterById[r.roster_id] || {}).owner_id] || {};
    const color = r.block ? 'var(--loss)' : 'var(--win)';
    const shown = teamName(r.roster_id);
    const uname = u.display_name && u.display_name.trim() !== shown.trim() ? u.display_name : '';
    return `<td class="num dim">${r.rank}</td>
      <td><div class="team">
        ${u.avatar ? `<img src="https://sleepercdn.com/avatars/thumbs/${esc(u.avatar)}" alt="" onerror="this.remove()">` : ''}
        <div><div class="name"><span class="caret">&#9654;</span> ${r.block ? '<span class="crown">&#129683;</span>' : ''}<span class="nm">${esc(shown)}</span></div>
        ${uname ? `<small class="uname">${esc(uname)}</small>` : ''}
        ${r.block ? '<small class="chopnote">on the chopping block</small>' : ''}
        ${ytpLine(r.roster_id)}</div>
      </div></td>
      ${faabOn ? `<td class="num ${byFaab ? 'lead' : 'dim'}">$${faabLeft(r.roster_id).toLocaleString()}</td>` : ''}
      <td class="num ${liveCls} ${useProj ? 'dim' : 'lead'}">${fmt(r.live)}</td>
      ${projOk ? `<td class="num ${projCls} ${useProj ? 'lead' : 'dim'}">${fmt(projByRoster[r.roster_id])}</td>` : ''}
      <td class="${faabOn ? 'hide-xs' : ''}"><div class="track">
        <div class="fill" style="width:${pct(r.points)};background:${color};opacity:.55"></div>
        <div class="med" style="left:${pct(med)}"></div>
      </div></td>
      <td class="num gap" style="color:${color}">${r.gap > 0 ? '+' : ''}${fmt(r.gap)}</td>`;
  };

  const rowCells = (r, i) => {
    if (chopped) return chopCells(r, i);
    const u = userById[(rosterById[r.roster_id] || {}).owner_id] || {};
    const king = r.rank === 1;
    const color = king ? 'var(--gold)' : r.med === 'W' ? 'var(--win)' : r.med === 'L' ? 'var(--loss)' : 'var(--tie)';
    const gapColor = r.med === 'W' ? 'var(--win)' : r.med === 'L' ? 'var(--loss)' : 'var(--tie)';
    // Half this league sets no team name, so their row already shows the username — don't repeat it.
    const shown = teamName(r.roster_id);
    const uname = u.display_name && u.display_name.trim() !== shown.trim() ? u.display_name : '';
    return `<td class="num dim">${r.rank}</td>
      <td><div class="team">
        ${u.avatar ? `<img src="https://sleepercdn.com/avatars/thumbs/${esc(u.avatar)}" alt="" onerror="this.remove()">` : ''}
        <div><div class="name"><span class="caret">&#9654;</span> ${king ? '<span class="crown">&#128081;</span>' : ''}<span class="nm">${esc(shown)}</span>${king ? '<span class="bonus">$10</span>' : ''}</div>
        ${uname ? `<small class="uname">${esc(uname)}</small>` : ''}
        <small>${record(r)}</small>
        ${ytpLine(r.roster_id)}</div>
      </div></td>
      <td class="num ${liveCls} ${useProj ? 'dim' : 'lead'}">${fmt(r.live)}</td>
      ${projOk ? `<td class="num ${projCls} ${useProj ? 'lead' : 'dim'}">${fmt(projByRoster[r.roster_id])}</td>` : ''}
      <td><div class="track">
        <div class="fill" style="width:${pct(r.points)};background:${color};opacity:.55"></div>
        <div class="med" style="left:${pct(med)}"></div>
      </div></td>
      <td class="num gap hide-xs" style="color:${gapColor}">${r.gap > 0 ? '+' : ''}${fmt(r.gap)}</td>
      <td class="num"><span class="pill ${r.med}">${r.med}</span></td>
      <td class="num hide-s">${r.h2h ? `<span class="pill ${r.h2h}">${r.h2h}</span>` : '<span class="dim">bye</span>'}</td>
      <td class="hide-s"><small class="dim">${r.oppRoster ? esc(teamName(r.oppRoster)) + ' ' + fmt(r.oppPoints) : ''}</small></td>`;
  };

  const notes = [
    chopped ? 'Chopped league: each week the lowest-scoring team still alive is eliminated. Cushion is how far a team sits above last place.'
      : medianOn ? '' : 'Heads up: this league does not have Sleeper median scoring enabled, so the projected records below are hypothetical.',
    mode === 'proj' && !projOk ? 'No projections available for this week — showing live points instead.' : '',
    useProj && inProgress ? 'Projected uses Sleeper&rsquo;s own live formula &mdash; each starter&rsquo;s pre-game projection blended toward their current pace as the clock runs down.' : '',
    !useProj && notStarted ? `${notStarted} teams have not kicked off yet — switch to Projected final to see the likely cut line.` : ''
  ].filter(Boolean).map(t => `<p class="note">${t}</p>`).join('');

  // The shell is built once and then only mutated. Rebuilding it on every refresh is what
  // cost the reader their scroll position: rows are now moved into rank order, never
  // destroyed, so the document height never changes underneath them.
  // Read before anything is written: rebuilding the shell below briefly empties the table,
  // and by the time it is refilled the browser has already clamped the offset to fit.
  const scrollY = window.scrollY;
  const sig = [leagueId, week, mode, projOk, useProj, cols, rows.length, chopped, dead.length, byFaab].join('|');
  // Also rebuild if the shell is gone (a "no matchups" message replaced it, say).
  if (out.dataset.sig !== sig || !out.querySelector('#tbl')) {
    out.dataset.sig = sig;
    out.innerHTML = `
    <div class="bar-head">
      <div class="stat"><span>League</span><b id="s-league"></b></div>
      <div class="stat"><span>Week ${week} ${useProj ? 'projected' : 'live'} ${chopped ? 'low score' : 'median'}</span><b id="s-med" style="color:var(--accent)"></b></div>
      <div class="stat"><span>${chopped ? 'Still alive' : 'Above the line'}</span><b id="s-above"></b></div>
      ${chopped ? '<div class="stat"><span>&#129683; On the chopping block</span><b id="s-king" style="color:var(--loss)"></b></div>'
                : '<div class="stat"><span>&#128081; Week leader &middot; $10</span><b id="s-king" style="color:var(--gold)"></b></div>'}
      <div class="stat"><span>Updated</span><b id="s-upd"></b></div>
    </div>
    <div id="notes"></div>
    <div class="tw"><table id="tbl"><thead><tr>
      <th></th><th>${chopped ? 'Team' : 'Team &rarr; projected record'}</th>
      ${faabOn ? `<th class="num"><button type="button" class="sort ${byFaab ? 'on' : ''}" data-sort="faab">FAAB</button></th>` : ''}
      <th class="num ${liveCls}"><button type="button" class="sort ${!byFaab && !useProj ? 'on' : ''}" data-mode="live">Live</button></th>
      ${projOk ? `<th class="num ${projCls}"><button type="button" class="sort ${!byFaab && useProj ? 'on' : ''}" data-mode="proj">Proj</button></th>` : ''}
      <th class="${faabOn ? 'hide-xs' : ''}">vs <span class="hide-xs">${useProj ? 'projected' : 'live'} </span>${chopped ? 'low score' : 'median'}</th>
      ${chopped ? '<th class="num">Cushion</th>'
                : '<th class="num hide-xs">Gap</th><th class="num">Med</th><th class="num hide-s">H2H</th><th class="hide-s">Opponent</th>'}
    </tr></thead><tbody></tbody><tbody id="deadrows"></tbody></table></div>`;
  }

  out.querySelector('#s-league').textContent = league.name;
  out.querySelector('#s-med').textContent = fmt(med);
  out.querySelector('#s-above').textContent = chopped ? `${rows.length} of ${rosters.length}`
    : `${rows.filter(r => r.med === 'W').length} of ${rows.length}`;
  const blockRow = rows.find(r => r.block);
  out.querySelector('#s-king').textContent = chopped ? (blockRow ? teamName(blockRow.roster_id) : '—')
    : teamName(rows[0].roster_id);
  out.querySelector('#s-upd').textContent = new Date().toLocaleTimeString();
  const notesEl = out.querySelector('#notes');
  if (notesEl.innerHTML !== notes) notesEl.innerHTML = notes;

  const tbody = out.querySelector('#tbl tbody');
  ordered.forEach((r, i) => {
    const rid = r.roster_id;
    let tr = tbody.querySelector(`tr.row[data-rid="${rid}"]`);
    let dt = tbody.querySelector(`tr.detail[data-rid="${rid}"]`);
    if (!tr) {
      tr = document.createElement('tr');
      tr.dataset.rid = rid;
      dt = document.createElement('tr');
      dt.className = 'detail';
      dt.dataset.rid = rid;
      dt.innerHTML = `<td colspan="${cols}"></td>`;
      tr.onclick = () => {
        expanded.has(rid) ? expanded.delete(rid) : expanded.add(rid);
        tr.classList.toggle('open', expanded.has(rid));
        dt.hidden = !expanded.has(rid);
      };
    }
    const crown = chopped ? (r.block ? 'block' : '') : (r.rank === 1 ? 'king' : '');
    tr.className = `row ${crown} ${i === half ? 'cut' : ''} ${expanded.has(rid) ? 'open' : ''}`;
    tr.innerHTML = rowCells(r, i);
    dt.hidden = !expanded.has(rid);
    if (chopped) {
      // No opponent in a chopped league: just this team's roster.
      dt.firstElementChild.innerHTML = matchupView(teamSide(rid, r.block ? 'trail' : ''), {}, ctx, true);
    } else {
      // Win probability always runs on the live projection, whichever column the table is
      // ranked by. Without projections it would just be "who is ahead right now", so skip it.
      const me = teamSide(rid, ''), opp = teamSide(r.oppRoster, '');
      if (projOk && opp.rid) [me.wp, opp.wp] = winProb(me.live, me.proj, opp.live, opp.proj);
      dt.firstElementChild.innerHTML = matchupView(me, opp, ctx);
    }
    tbody.append(tr, dt);
  });

  // Teams already chopped, most recent first. Static within a week, so only written on change.
  const deadHtml = dead.length ? `<tr class="dead-head"><td colspan="${cols}">Chopped</td></tr>` + dead.map(r => {
    const u = userById[r.owner_id] || {};
    return `<tr class="dead"><td class="num dim">&ndash;</td><td colspan="${cols - 1}"><div class="team">
      ${u.avatar ? `<img src="https://sleepercdn.com/avatars/thumbs/${esc(u.avatar)}" alt="" onerror="this.remove()">` : ''}
      <div><div class="name"><span class="nm">${esc(teamName(r.roster_id))}</span></div>
      <small>Chopped &middot; week ${r.settings.eliminated}</small></div></div></td></tr>`;
  }).join('') : '';
  const deadEl = out.querySelector('#deadrows');
  if (deadEl.dataset.html !== deadHtml) { deadEl.innerHTML = deadHtml; deadEl.dataset.html = deadHtml; }

  keepScroll(scrollY);
  return league;
}

// Watch for a redeploy: this page is meant to be left open all Sunday, and a tab
// running yesterday's JavaScript looks exactly like a bug that was never fixed.
let buildTag = null;
async function checkBuild(){
  if (!location.protocol.startsWith('http')) return;
  try {
    const r = await fetch(location.pathname, { method: 'HEAD', cache: 'no-store' });
    const tag = r.headers.get('etag') || r.headers.get('last-modified');
    if (!tag) return;
    if (buildTag === null) buildTag = tag;
    else if (tag !== buildTag) $('#newver').hidden = false;
  } catch (e) { /* offline or blocked; try again next time */ }
}

// Browser storage can be unavailable (private windows, blocked site data); the page must
// still work, it just won't remember anything.
// Plain values are stored as raw strings, lists as JSON. Never JSON-parse a league ID:
// it is past the integer precision of a JS number and comes back silently changed.
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
  json(k, fallback) { try { return JSON.parse(localStorage.getItem(k)) ?? fallback; } catch { return fallback; } }
};

// A league ID is a long run of digits; anything else is treated as a Sleeper username.
const isLeagueId = v => /^\d{10,}$/.test(v);

async function leaguesFor(userId, season){
  const list = await get(`/v1/user/${userId}/leagues/nfl/${season}`) || [];
  return list.map(l => ({ id: l.league_id, name: l.name }));
}

async function boot(){
  const p = new URLSearchParams(location.search);
  const state = await get('/v1/state/nfl').catch(() => ({ week: 1 }));
  const season = state.league_season || state.season;
  const cur = +(p.get('week') || state.week || 1);
  $('#wk').innerHTML = Array.from({length: 18}, (_, i) =>
    `<option value="${i+1}" ${i+1 === cur ? 'selected' : ''}>Week ${i+1}</option>`).join('');
  let mode = p.get('mode') || ls.get('mode') || 'live';
  let sort = 'score';                               // or 'faab' (chopped leagues)

  // Leagues come from two places: everything the saved Sleeper user is in (looked up fresh
  // each visit, so new leagues just appear), and league IDs added or opened by hand —
  // a friend's league, say — which are kept in the browser.
  let user = ls.json('sleeperUser', null);          // { id, name }
  let saved = ls.json('leagues', []);               // [{ id, name }]
  let mine = user ? await leaguesFor(user.id, season).catch(() => []) : [];
  let current = p.get('league') || ls.get('leagueId') || (mine[0] || saved[0] || {}).id || '';

  const msg = (text, isErr) => {
    $('#msg').textContent = text || '';
    $('#msg').hidden = !text;
    $('#msg').classList.toggle('err', !!isErr);
  };

  const render = () => {
    const extra = saved.filter(l => !mine.some(m => m.id === l.id));
    const opts = list => list.map(l => `<option value="${esc(l.id)}">${esc(l.name)}</option>`).join('');
    $('#league').innerHTML =
      (mine.length ? `<optgroup label="${esc('@' + user.name)}">${opts(mine)}</optgroup>` : '') +
      (extra.length ? `<optgroup label="Saved leagues">${opts(extra)}</optgroup>` : '');
    $('#league').hidden = !$('#league').options.length;
    $('#league').value = current;
    // Only hand-saved leagues can be removed; the user's own come back on the next lookup.
    $('#rm').hidden = !extra.some(l => l.id === current);
    $('#who').hidden = !user;
    if (user) $('#who').innerHTML = `Showing leagues for @${esc(user.name)} &middot; <button type="button" class="link" id="forget">forget</button>`;
    $('#add').placeholder = user ? 'Add a league ID, or another username' : 'Add your Sleeper username or a league ID';
  };

  // Any league that loads is kept, so a bookmarked or pasted friend's league stays in the list.
  const remember = league => {
    if (!league || mine.some(m => m.id === league.league_id)) return;
    const hit = saved.find(l => l.id === league.league_id);
    if (hit && hit.name === league.name) return;    // nothing changed; don't rebuild the menu every 30s
    if (hit) hit.name = league.name; else saved.push({ id: league.league_id, name: league.name });
    ls.set('leagues', JSON.stringify(saved));
    render();
  };

  // The browser ties a scroll position to each history entry and restores it on a state
  // change; we manage it ourselves instead.
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

  const go = () => {
    const wk = $('#wk').value;
    if (!current) {
      $('#out').innerHTML = '';
      msg('Add your Sleeper username to pick from your leagues, or paste a league ID.');
      return;
    }
    ls.set('leagueId', current);
    ls.set('mode', mode);
    // Only touch history when the URL actually changes. Rewriting it on every 30s refresh
    // was handing the browser a reason to scroll back to the top.
    const url = `?league=${current}&week=${wk}&mode=${mode}`;
    if (location.search !== url) history.replaceState(null, '', url);
    const id = current;
    load(id, wk, mode, sort).then(league => { if (id === current) remember(league); }).catch(e => {
      // Keep whatever is on screen if a refresh fails; the Updated time stops advancing,
      // which is the signal that it went stale.
      if ($('#out').querySelector('table')) console.warn('refresh failed:', e.message);
      else $('#out').innerHTML = `<p class="err">${esc(e.message)}</p>`;
    });
  };

  const choose = id => {
    // Same league, but the lists may have changed (a username was just added), so redraw.
    if (id === current) { render(); return go(); }
    current = id;
    expanded.clear();                               // roster ids 1-12 repeat across leagues
    sort = 'score';
    $('#out').innerHTML = '';
    window.scrollTo(0, 0);
    render();
    go();
  };

  $('#f').onsubmit = async e => {
    e.preventDefault();
    const v = $('#add').value.trim();
    if (!v) return;
    msg('Looking that up…');
    try {
      if (isLeagueId(v)) {
        const league = await get(`/v1/league/${v}`).catch(() => null);
        if (!league || !league.league_id) throw new Error(`No Sleeper league with ID ${v}.`);
        mine.some(m => m.id === league.league_id) || saved.some(l => l.id === league.league_id)
          || (saved.push({ id: league.league_id, name: league.name }), ls.set('leagues', JSON.stringify(saved)));
        msg('');
        choose(league.league_id);
      } else {
        const u = await get(`/v1/user/${encodeURIComponent(v)}`).catch(() => null);
        if (!u || !u.user_id) throw new Error(`No Sleeper user called “${v}”.`);
        const found = await leaguesFor(u.user_id, season);
        if (!found.length) throw new Error(`@${u.display_name || v} isn't in any ${season} leagues.`);
        user = { id: u.user_id, name: u.display_name || v };
        mine = found;
        ls.set('sleeperUser', JSON.stringify(user));
        msg('');
        choose(mine.some(m => m.id === current) ? current : mine[0].id);
      }
      $('#add').value = '';
    } catch (err) {
      msg(err.message, true);
    }
  };
  $('#league').onchange = () => choose($('#league').value);
  $('#rm').onclick = () => {
    saved = saved.filter(l => l.id !== current);
    ls.set('leagues', JSON.stringify(saved));
    choose((mine[0] || saved[0] || {}).id || '');
  };
  $('#who').addEventListener('click', e => {
    if (e.target.id !== 'forget') return;
    user = null; mine = [];
    ls.set('sleeperUser', null);
    choose(saved.some(l => l.id === current) ? current : (saved[0] || {}).id || '');
  });
  $('#wk').onchange = go;
  // Delegated because the header is rebuilt whenever the mode changes.
  $('#out').addEventListener('click', e => {
    const btn = e.target.closest('button.sort');
    if (!btn) return;
    if (btn.dataset.sort === 'faab') {
      if (sort === 'faab') return;
      sort = 'faab';
      return go();
    }
    let next = btn.dataset.mode;
    // On a phone only the active column is shown, so tapping it swaps to the other one.
    if (btn.classList.contains('on') && matchMedia('(max-width:560px)').matches)
      next = next === 'proj' ? 'live' : 'proj';
    // Live/Proj also put the rows back in score order, even if the mode is unchanged.
    if (next === mode && sort === 'score') return;
    mode = next;
    sort = 'score';
    go();
  });
  setInterval(() => { if (!document.hidden && current) go(); }, 30000);
  checkBuild();
  setInterval(() => { if (!document.hidden) checkBuild(); }, 300000);
  render();
  go();
}

function selftest(){
  const a = (c, m) => { if (!c) throw new Error(m); };
  a(median([1,2,3]) === 2, 'odd median');
  a(median([1,2,3,4]) === 2.5, 'even median');

  const w = computeWeek([
    {roster_id:1, matchup_id:1, points:100}, {roster_id:2, matchup_id:1, points:90},
    {roster_id:3, matchup_id:2, points:80},  {roster_id:4, matchup_id:2, points:70}
  ]);
  a(w.median === 85, 'median of week');
  const r = Object.fromEntries(w.rows.map(x => [x.roster_id, x]));
  a(r[1].h2h === 'W' && r[1].med === 'W', 'top team sweeps');
  a(r[4].h2h === 'L' && r[4].med === 'L', 'bottom team drops two');
  a(r[2].med === 'W' && r[2].h2h === 'L', 'h2h loser can still beat median');
  a(r[3].gap === -5, 'gap to median');
  a(computeWeek([{roster_id:1, matchup_id:null, points:50}]).rows[0].h2h === null, 'bye has no h2h');

  const near = (x, y) => Math.abs(x - y) < 0.005;
  const secs = secondsLeftByTeam([
    {status:'pre_game', metadata:{home_team:'AAA', away_team:'BBB'}},
    {status:'complete', metadata:{home_team:'CCC', away_team:'DDD'}},
    {status:'in_game', metadata:{home_team:'EEE', away_team:'FFF', quarter:'3', time_remaining:'00:00'}},
    {status:'in_game', metadata:{home_team:'GGG', away_team:'HHH', quarter:'1', time_remaining:'15:00'}},
    {status:'in_game', metadata:{home_team:'III', away_team:'JJJ', quarter:'HALF', time_remaining:'00:00'}},
    {status:'in_game', metadata:{home_team:'KKK', away_team:'LLL', quarter:'4', time_remaining:'02:00'}}
  ]);
  a(secs.AAA === 3600 && secs.BBB === 3600, 'pre-game has the full hour left');
  a(secs.CCC === 0, 'final has none left');
  a(secs.EEE === 900, 'end of Q3 leaves a quarter');
  a(secs.GGG === 3600, 'kickoff leaves the full game');
  a(secs.III === 1800, 'halftime leaves a half');
  a(secs.KKK === 120, 'two minutes in Q4');

  // Real numbers read off Sleeper's own matchup screen; ours must reproduce them.
  a(near(liveProjection(28.48, 19.98, 120), 28.51), 'matches Sleeper: Purdy 28.51');
  a(near(liveProjection(5.00, 8.22, 120), 5.11), 'matches Sleeper: Pineiro 5.11');
  a(near(liveProjection(8.30, 14.05, 101), 8.47), 'matches Sleeper: Jeanty 8.47');
  a(near(liveProjection(4.50, 11.02, 287), 5.05), 'matches Sleeper: Price 5.05');
  a(liveProjection(0, 16.55, 3600) === 16.55, 'before kickoff it is just the projection');
  a(near(liveProjection(18.60, 12.67, 0), 18.60), 'at the whistle it is just the actual');

  // Real stat lines, checked against what Sleeper's own matchup screen printed.
  a(statLine({pass_cmp:20, pass_att:22, pass_yd:287, pass_td:2, rush_att:3, rush_yd:30, rush_td:1})
    === '20/22 CMP, 287 YD, 2 TD, 3 CAR, 30 YD, 1 TD', 'QB line');
  a(statLine({rush_att:13, rush_yd:52, rec:1, rec_tgt:2, rec_yd:8, fum_lost:1})
    === '13 CAR, 52 YD, 1/2 REC, 8 YD, 1 FUM LOST', 'RB line with a fumble');
  a(statLine({xpm:5, xpa:5}) === '5/5 XP', 'kicker line');
  a(statLine({pts_allow:17, yds_allow:285, sack:4, def_3_and_out:2, def_4_and_stop:1, def_pass_def:4})
    === '17 PTS ALLOW, 285 YDS ALLOW, 4 SACK, 2 3 & OUT, 1 4D STOP, 4 PD', 'defense line');
  a(statLine({pts_allow:0, yds_allow:120, sack:0}) === '0 PTS ALLOW, 120 YDS ALLOW',
    'a shutout still prints, a zero sack count does not');
  a(statLine(null) === '' && statLine({}) === '', 'no stats yet, no line');

  // Assert on the computed style, not the .hidden property: the property is honoured
  // regardless, it is the painting that an id-specificity rule can silently override.
  const banner = document.querySelector('#newver');
  banner.hidden = false;
  a(getComputedStyle(banner).display !== 'none', 'shown banner is painted');
  banner.hidden = true;
  a(getComputedStyle(banner).display === 'none', 'hidden banner is actually not painted');

  const projById = {p1:{team:'AAA', pts:20}, p2:{team:'CCC', pts:18}, p3:{team:'KKK', pts:12}};
  const t = projectTeam({starters:['p1','p2','p3','0'], starters_points:[0, 14, 5, 0]}, projById, secs);
  a(t === 39.24, 'team total sums per-starter live projections; got ' + t);
  a(projectTeam({starters:['zz'], starters_points:[7]}, {}, secs) === 7, 'unprojected starter still banks actual');

  // Roster 1 has not kicked off; roster 2 is nearly done and cannot add much.
  const wk = [
    {roster_id:1, matchup_id:1, points:0,  starters:['q1'], starters_points:[0]},
    {roster_id:2, matchup_id:1, points:25, starters:['q2'], starters_points:[25]}
  ];
  const pb = {q1:{team:'AAA', pts:30}, q2:{team:'KKK', pts:12}};
  const lw = computeWeek(wk);
  a(lw.rows[0].med === 'L' && lw.rows[1].med === 'W', 'live view: roster 2 is above the median');
  const pw = computeWeek(wk, m => projectTeam(m, pb, secs));
  a(pw.median === 27.515, 'projected median, got ' + pw.median);
  a(pw.rows[0].points === 30 && pw.rows[0].live === 0, 'row keeps both live and projected totals');
  a(pw.rows[0].med === 'W' && pw.rows[1].med === 'L', 'projection flips who clears the median');

  // Win probability — the first case is the matchup from a Sleeper screenshot (81% / 19%).
  a(Math.abs(normCdf(0) - 0.5) < 1e-7 && Math.abs(normCdf(1.96) - 0.975) < 1e-4, 'normal CDF');
  const [w1, w2] = winProb(91.05, 147.91, 95.80, 121.68);
  a(Math.round(w1 * 100) === 81 && Math.round(w2 * 100) === 19, 'matches Sleeper: 81% / 19%; got ' + w1 + ' / ' + w2);
  a(Math.abs(w1 + w2 - 1) < 1e-9, 'the two sides add up to 100%');
  a(winProb(120, 120, 110, 110).join() === '1,0', 'both finished: the winner gets 100%');
  a(winProb(110, 110, 110, 110).join() === '0,0', 'both finished level: a tie');
  const [lo] = winProb(0, 20, 0, 200);       // raw ~0.15%, so the 1% floor applies
  a(lo === 0.01, 'never below 1% while there is football left');
  const [even] = winProb(50, 100, 50, 100);
  a(Math.abs(even - 0.5) < 1e-9, 'identical teams are a coin flip');

  // Yet to play.
  const ypProj = { a: { team: 'SF', pos: 'WR' }, b: { team: 'SF', pos: 'QB' }, c: { team: 'NO', pos: 'WR' },
                   d: { team: 'SF', pos: 'WR' }, e: { team: 'SF', pos: 'DEF' } };
  const yp = yetToPlay(['a', 'b', 'c', 'd', 'e', '0'], ypProj, new Set(['SF']));
  a(yp.n === 4 && yp.list === 'QB, 2 WR, DEF', 'grouped by position in lineup order; got ' + yp.list);
  a(yetToPlay(['c'], ypProj, new Set(['SF'])).n === 0, 'a player whose game has started is not yet to play');
  a(yetToPlay(undefined, ypProj, new Set()).list === '', 'no lineup, nothing to play');

  // Chopped leagues.
  a(isChopped({ settings: { type: 3 } }, []), 'type 3 is a chopped league');
  a(isChopped({ settings: { type: 0, last_chopped_leg: 2 } }, []), 'last_chopped_leg marks one too');
  a(isChopped({ settings: {} }, [{ settings: { eliminated: 1 } }]), 'an eliminated roster marks one');
  a(!isChopped({ settings: { type: 0, league_average_match: 1 } }, [{ settings: {} }]), 'a median league is not chopped');
  a(!choppedBefore({ settings: { eliminated: 5 } }, '5'), 'a team chopped in week 5 still played week 5');
  a(choppedBefore({ settings: { eliminated: 5 } }, '6'), '...and is gone in week 6');
  a(!choppedBefore({ settings: {} }, '6'), 'a survivor is never chopped');
  const ch = computeChop([{ roster_id: 1, points: 80 }, { roster_id: 2, points: 100 }, { roster_id: 3, points: 90 }]);
  a(ch.line === 80 && ch.rows.map(r => r.roster_id).join() === '2,3,1', 'survivors ranked, line at the low score');
  a(ch.rows[0].gap === 20 && ch.rows[1].gap === 10, 'cushion is the margin over last place');
  a(ch.rows[2].block && ch.rows[2].gap === -10, 'last place is on the block, needing 10 to escape');
  a(ch.rows.filter(r => r.block).length === 1, 'exactly one team on the block');
  const last = computeChop([{ roster_id: 7, points: 0 }]);
  a(!last.rows[0].block && last.rows[0].gap === 0, 'a lone survivor has won, not been chopped');

  document.body.innerHTML = '<p style="padding:24px;color:#22c55e">selftest: all passed</p>';
}

new URLSearchParams(location.search).has('test') ? selftest() : boot();
</script>
